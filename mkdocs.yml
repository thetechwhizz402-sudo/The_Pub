site_name: LewdPub Website Guide
site_description: An independent, multi-page guide to the public sections of LewdPub.
site_url: https://YOUR-GITHUB-USERNAME.github.io/YOUR-REPOSITORY/
repo_name: YOUR-GITHUB-USERNAME/YOUR-REPOSITORY
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: deep purple
      accent: pink
nav:
  - Home: index.md
  - About LewdPub: about.md
  - Game Library: game-library.md
  - Game Discovery: game-discovery.md
  - Recently Updated: updates.md
  - Game Engines: engines.md
  - Collections: collections.md
  - Game Requests: requests.md
  - Game Pages: game-pages.md
  - Help & Contact: help-and-contact.md
  - Policies: policies.md
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
